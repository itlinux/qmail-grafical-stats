# POP3 and IMAP were wide open: the qmail jails only read the vpopmail
# SMTP-side lines, so mailbox-protocol guessing was never blocked at all.
# maxretry is a little higher than the SMTP jails because mail clients retry
# by themselves after a password change, and that should not look like an
# attack straight away.
[dovecot]
enabled = true
filter = dovecot
port = pop3,pop3s,imap,imaps
logpath = /var/log/dovecot.log
# Dovecot here logs to a file, not the journal; without this the distro
# default (backend = systemd) watches a source that is always empty.
backend = polling
maxretry = 5
findtime = 3600
bantime = 86400
