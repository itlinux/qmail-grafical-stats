# A slow attacker defeats a one-hour window by pacing itself: one address had
# 138 failures spread over eight days and never tripped 5-in-an-hour. This
# watches a whole day instead. Ten failures in 24 hours is still far more than
# a real client produces after a password change, and the ban is a week.
[dovecot-slow]
enabled = true
filter = dovecot
port = pop3,pop3s,imap,imaps
logpath = /var/log/dovecot.log
backend = polling
maxretry = 10
findtime = 86400
bantime = 604800
