# The pace of a patient attacker: one address ran 9-10 failures a day for over
# a week, staying under both an hourly and a daily threshold. Twenty failures
# across a whole week is a rate no real client reaches -- the busiest
# legitimate source here, the webmail host, managed 19 in total and is
# exempt anyway -- so this window catches patience rather than bursts.
[dovecot-persistent]
enabled = true
filter = dovecot
port = pop3,pop3s,imap,imaps
logpath = /var/log/dovecot.log
backend = polling
maxretry = 20
findtime = 604800
bantime = 2419200
