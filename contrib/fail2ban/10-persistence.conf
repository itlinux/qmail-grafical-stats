# Install as /etc/fail2ban/fail2ban.d/10-persistence.conf
#
# How long fail2ban remembers bans in its database. It must be at least the
# longest possible ban -- bantime.maxtime in 00-defaults.conf is 52 weeks -- or
# a restart forgets bans that were still meant to be in force, and the offence
# history that bantime.increment escalates from is thrown away after a day.
# The fail2ban default is one day.
[DEFAULT]
dbpurgeage = 31536000
