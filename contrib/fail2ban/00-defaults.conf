# Shared defaults for every jail.
#
# This file is named to sort first: settings appended to the end of a file that
# already contains jail sections land inside the last section, not in DEFAULT,
# and then apply to one jail instead of all of them.

[DEFAULT]
# firewalld owns the firewall here, so bans go through it.
banaction = firewallcmd-rich-rules
banaction_allports = firewallcmd-rich-rules

# Never ban: localhost, your mail servers, your own address, and any gateway that fronts a whole network --
# banning one of those would cut off everything behind it.
ignoreip = 127.0.0.1/8 ::1 192.0.2.10 198.51.100.20

# Repeat offenders earn progressively longer bans: a day, then two, four,
# eight and so on, up to a year.
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 52w
