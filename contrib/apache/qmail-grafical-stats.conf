# Mail statistics dashboard. The application itself has no authentication and
# listens only on loopback; this is what stands in front of it.
RedirectMatch ^/stats$ /stats/

<Location /stats/>
    AuthType Basic
    AuthName "qmail statistics"
    AuthUserFile /etc/qmail-grafical-stats/htpasswd
    Require valid-user

    ProxyPass        http://127.0.0.1:8765/
    ProxyPassReverse http://127.0.0.1:8765/

    # Mail metadata: never cached by a shared proxy, never indexed.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set Cache-Control "private, no-store"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
</Location>
