# vchkpw logs the password that was tried on every failed login:
#
#     vchkpw-smtps: password fail (pass: 'whatever-was-typed') user@example.com:192.0.2.1
#
# That is compiled into the QMT vpopmail package with no runtime switch, and it
# puts real users' near-miss passwords into maillog, its rotated copies and
# every backup of them. Rewrite those lines with the password removed before
# the mail.* rule in rsyslog.conf writes them, then stop so the original is
# never written.
#
# The replacement deliberately contains no "@" or ":" -- the fail2ban
# passfail filters parse the rest of the line with [^@]* and [^:]*.
template(name="VpopmailRedacted" type="list") {
    property(name="timereported" dateFormat="rfc3164")
    constant(value=" ")
    property(name="hostname")
    constant(value=" ")
    property(name="syslogtag")
    # The stock file format inserts a space when the message does not start
    # with one, and vpopmail's messages do not.
    constant(value=" ")
    property(name="msg" regex.type="ERE" regex.submatch="1"
             regex.expression="^(.*\\(pass: )'.*'(\\).*)$")
    constant(value="<redacted>")
    property(name="msg" regex.type="ERE" regex.submatch="2"
             regex.expression="^(.*\\(pass: )'.*'(\\).*)$")
    constant(value="\n")
}

if ($syslogfacility-text == "mail" and $programname == "vpopmail"
    and $msg contains "(pass: '") then {
    action(type="omfile" file="/var/log/maillog" sync="on"
           template="VpopmailRedacted")
    stop
}
